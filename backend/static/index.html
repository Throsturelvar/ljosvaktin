<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ljósvaktin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: oklch(0.17 0.028 270);
    --bg-card: oklch(0.22 0.032 270);
    --text: oklch(0.95 0.012 95);
    --text-muted: oklch(0.68 0.025 270);
    --border: oklch(0.34 0.03 270);
    --night-1: oklch(0.13 0.035 270);
    --night-2: oklch(0.24 0.09 300);
    --teal: oklch(0.75 0.15 152);
    --teal-dark: oklch(0.55 0.13 152);
    --violet: oklch(0.68 0.17 305);
    --violet-dark: oklch(0.5 0.15 305);
    --amber: oklch(0.78 0.14 65);
    --amber-dark: oklch(0.6 0.14 60);
    --grey: oklch(0.55 0.02 270);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Work Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  h1, h2, h3, .display { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }
  a { color: var(--teal); text-decoration: none; }
  a:hover { color: var(--violet); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 999px; font-family: "Work Sans", system-ui, sans-serif; font-weight: 600; font-size: 16px; cursor: pointer; border: none; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 32px; }

  nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid var(--border); background: oklch(0.17 0.028 270 / 0.85); backdrop-filter: blur(10px); }
  nav .links { display: flex; gap: 32px; font-size: 15px; font-weight: 500; color: var(--text-muted); }
  @media (max-width: 720px) { nav .links { display: none; } }

  .hero { position: relative; margin: 36px 0 0; border-radius: 26px; overflow: hidden; background: linear-gradient(135deg, var(--night-1), var(--night-2)); padding: 48px; display: flex; align-items: center; justify-content: space-between; gap: 40px; flex-wrap: wrap; color: white; }
  .aurora-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .aurora-wave { animation: auroraDrift 11s ease-in-out infinite; transform-origin: center; }
  .aurora-wave.w2 { animation-duration: 15s; animation-delay: -4s; }
  .aurora-wave.w3 { animation-duration: 19s; animation-delay: -8s; }
  @keyframes auroraDrift {
    0%, 100% { transform: translateY(0) scaleY(1); opacity: 0.55; }
    50% { transform: translateY(-12px) scaleY(1.08); opacity: 0.9; }
  }
  .star { fill: white; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.85; } }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); display: inline-block; animation: pulseDot 2s ease-in-out infinite; }
  @keyframes pulseDot {
    0%, 100% { box-shadow: 0 0 0 0 oklch(0.75 0.15 152 / 0.55); }
    50% { box-shadow: 0 0 0 5px oklch(0.75 0.15 152 / 0); }
  }
  .hero-copy { max-width: 600px; z-index: 1; }
  .hero-title { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.15; margin: 16px 0; }
  .hero-desc { font-size: 16px; color: rgba(255,255,255,0.78); line-height: 1.6; margin-bottom: 8px; }
  .score-card { z-index: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px; padding: 28px 34px; text-align: center; min-width: 180px; }
  .score-num { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; font-size: 64px; color: var(--teal); line-height: 1; }

  .row { display: flex; gap: 28px; margin: 40px 0 0; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 320px; }
  .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 22px; padding: 28px; }
  .panel-dark { background: var(--night-1); border-radius: 22px; padding: 28px; color: white; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
  .card { position: relative; background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; animation: cardIn 0.5s ease backwards; transition: transform 0.18s ease, box-shadow 0.18s ease; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 26px -10px oklch(0.24 0.02 265 / 0.2); }
  .card.besti { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal), 0 14px 30px -12px oklch(0.75 0.15 152 / 0.4); }
  .besti-bordi { position: absolute; top: -11px; right: 18px; background: var(--teal); color: var(--night-1); font-family: "Work Sans", system-ui, sans-serif; font-weight: 700; font-size: 11.5px; padding: 4px 12px; border-radius: 999px; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card-row { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; margin-top: 8px; }
  .card-row span:first-of-type { color: var(--text-muted); min-width: 92px; flex-shrink: 0; }

  #content.fade-in { animation: contentFadeIn 0.35s ease; }
  @keyframes contentFadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .aurora-wave, .star, .live-dot, .card, #content.fade-in { animation: none !important; }
  }

  .source-item { display: flex; gap: 12px; align-items: flex-start; background: rgba(255,255,255,0.06); border-radius: 14px; padding: 13px 15px; margin-top: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }

  #map { width: 100%; height: 320px; border-radius: 14px; margin-top: 4px; }
  .legend { display: flex; gap: 20px; margin-top: 12px; font-size: 13px; color: var(--text-muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .map-popup { font-family: "Work Sans", sans-serif; color: var(--text); }
  .map-popup .display { font-family: "Instrument Serif", Georgia, serif; font-size: 17px; font-weight: 400; margin-bottom: 4px; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--bg-card); color: var(--text); }
  .leaflet-popup-close-button { color: var(--text-muted) !important; }
  .leaflet-control-attribution { background: oklch(0.17 0.028 270 / 0.7) !important; color: rgba(255,255,255,0.55) !important; }
  .leaflet-control-attribution a { color: rgba(255,255,255,0.8) !important; }
  .leaflet-control-zoom a { background: var(--bg-card) !important; color: var(--text) !important; border-color: var(--border) !important; }

  footer { margin: 56px 0 40px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); line-height: 1.6; }
  .loading, .error { padding: 40px; text-align: center; color: var(--text-muted); }
  .error { color: var(--amber); }

  .day-tabs { display: flex; gap: 8px; margin-top: 32px; }
  .day-tab { font-family: "Work Sans", system-ui, sans-serif; font-weight: 600; font-size: 14.5px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); cursor: pointer; }
  .day-tab.virkur { background: var(--teal); color: var(--night-1); border-color: var(--teal); }
  .forecast-note { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: rgba(255,255,255,0.6); margin-top: 10px; }

  .loc-btn { display: inline-flex; align-items: center; gap: 7px; font-family: "Work Sans", system-ui, sans-serif; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); cursor: pointer; }
  .loc-btn:hover { border-color: var(--teal); }
  .loc-btn.leita { opacity: 0.6; cursor: wait; }
  .loc-result { margin-top: 16px; padding: 14px 18px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border); font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .loc-result.villa { border-color: var(--amber); color: var(--amber); }
  .loc-result button { font-family: "Work Sans", system-ui, sans-serif; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 999px; border: none; background: var(--teal); color: var(--night-1); cursor: pointer; }
  .card.i-fokus { outline: 3px solid var(--teal); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div style="display:flex; align-items:center; gap:12px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c2-4 4-6 6-6s3 4 5 4 3-5 6-5"/><path d="M3 12c2-3.5 4-5 6-5s3 3.5 5 3.5 3-4.5 6-4.5"/></svg>
      <div class="display" style="font-size:22px;">Ljósvaktin</div>
    </div>
    <div style="display:flex; align-items:center; gap:24px;">
      <div class="links">
        <a href="#stadir">Allir staðir</a>
        <a href="#gogn">Um gögnin</a>
      </div>
      <button class="loc-btn" id="locBtn" onclick="finnaStadsetningu()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="locBtnText">Nálægt mér</span>
      </button>
    </div>
  </nav>

  <div class="day-tabs" id="dagatabs"></div>
  <div id="locResult"></div>

  <div id="content">
    <div class="loading">Sæki nýjustu gögn …</div>
  </div>

  <footer>
    Gögn frá NOAA SWPC (norðurljósavirkni), MET Noregi (skýjahula) og sunrisesunset.io (myrkur og tungl). Öll gögn eru opin og aðgengileg án skráningar. · Ljósvaktin · frumgerð
  </footer>
</div>

<script>
const COLOR_TEAL = "oklch(0.75 0.15 152)";
const COLOR_TEAL_LIGHT = "oklch(0.82 0.09 152)";
const COLOR_TEAL_DARK = "oklch(0.55 0.15 152)";
const COLOR_VIOLET = "oklch(0.68 0.17 305)";
const COLOR_AMBER = "oklch(0.78 0.14 65)";
const COLOR_GREY = "oklch(0.55 0.02 270)";

let leafletMap = null;
let markerarMap = {};
let sidustuGognin = null;
let valinnDagur = 0;

const VIKUDAGA_KVOLD = ["sunnudagskvöld", "mánudagskvöld", "þriðjudagskvöld", "miðvikudagskvöld", "fimmtudagskvöld", "föstudagskvöld", "laugardagskvöld"];

function dagsMerki(offset) {
  if (offset === 0) return "Í kvöld";
  if (offset === 1) return "Annað kvöld";
  const nu = new Date();
  const d = new Date(Date.UTC(nu.getUTCFullYear(), nu.getUTCMonth(), nu.getUTCDate() + offset));
  const orð = VIKUDAGA_KVOLD[d.getUTCDay()];
  return orð.charAt(0).toUpperCase() + orð.slice(1);
}

function teiknaTabs() {
  const html = [0, 1, 2].map(d =>
    `<button class="day-tab ${d === valinnDagur ? "virkur" : ""}" onclick="setDagur(${d})">${dagsMerki(d)}</button>`
  ).join("");
  document.getElementById("dagatabs").innerHTML = html;
}

function setDagur(d) {
  if (d === valinnDagur) return;
  valinnDagur = d;
  teiknaTabs();
  document.getElementById("content").innerHTML = '<div class="loading">Sæki nýjustu gögn …</div>';
  saekja();
}

const HEIMILDIR = [
  {
    heiti: "NOAA SWPC — norðurljósavirkni",
    lysing: "OVATION-líkanið og Kp-spá, uppfært á 30–60 mín fresti.",
    litur: "var(--teal)",
    utskyring: "Norðurljósavirkni er prósentulíkur á að norðurljós sjáist á hverjum stað. NOAA reiknar hana með OVATION-líkaninu út frá mælingum á sólvindi frá gervitungli í um 1,6 milljón km fjarlægð frá jörðu, og spáin nær 30–90 mínútur fram í tímann.",
    stig: [
      { heiti: "Lítil virkni", bil: "0–20%", litur: COLOR_GREY },
      { heiti: "Meðal virkni", bil: "20–50%", litur: COLOR_TEAL_LIGHT },
      { heiti: "Mikil virkni", bil: "50–80%", litur: COLOR_TEAL },
      { heiti: "Mjög mikil virkni", bil: "80–100%", litur: COLOR_TEAL_DARK },
    ],
  },
  { heiti: "MET Noregur", lysing: "Skýjaspá fyrir hvern stað.", litur: "var(--amber)" },
  { heiti: "sunrisesunset.io", lysing: "Nákvæmur myrkurgluggi og tunglbirta.", litur: "var(--amber)" },
];

function stjornuSvg(fjoldi) {
  let ut = "";
  for (let i = 0; i < fjoldi; i++) {
    const x = Math.round(Math.random() * 800);
    const y = Math.round(Math.random() * 190);
    const r = (Math.random() * 1.1 + 0.5).toFixed(1);
    const seinkun = (Math.random() * 3.6).toFixed(1);
    ut += `<circle class="star" cx="${x}" cy="${y}" r="${r}" style="animation-delay:${seinkun}s"/>`;
  }
  return ut;
}

function teiknaSkorTolu(elId, markgildi) {
  const el = document.getElementById(elId);
  if (!el) return;
  const timi = 700;
  const t0 = performance.now();
  function stig(nu) {
    const framvinda = Math.min(1, (nu - t0) / timi);
    const mytkt = 1 - Math.pow(1 - framvinda, 3);
    el.textContent = (markgildi * mytkt).toFixed(1);
    if (framvinda < 1) requestAnimationFrame(stig);
  }
  requestAnimationFrame(stig);
}

function tier(skor) {
  if (skor >= 65) return { litur: COLOR_TEAL, texti: "Frábært" };
  if (skor >= 40) return { litur: COLOR_AMBER, texti: "Sæmilegt" };
  return { litur: COLOR_GREY, texti: "Óhagstætt" };
}

function birtaVirkniEdaKp(s) {
  const v = s.hra_gogn.virkni_ovation;
  if (v != null) return { merki: "Norðurljósavirkni", gildi: `${Math.round(v)}%` };
  const kp = s.hra_gogn.kp_leitni;
  return { merki: "Kp-spá", gildi: kp != null ? `${kp.toFixed(1)}/9 (landsvísu)` : "?" };
}

function birtaSky(s) {
  return s == null ? "?" : `${Math.round(s)}%`;
}

function birtaUv(uv) {
  return uv == null ? "?" : uv.toFixed(1);
}

function birtaHiti(hiti, hitiFinnst) {
  if (hiti == null) return "?";
  const finnst = hitiFinnst != null && Math.round(hitiFinnst) !== Math.round(hiti)
    ? ` (finnst ${Math.round(hitiFinnst)}°)`
    : "";
  return `${Math.round(hiti)}°C${finnst}`;
}

function birtaMyrkur(fra, til) {
  if (!fra || !til) return "?";
  const t = (iso) => new Date(iso).toLocaleTimeString("is-IS", { hour: "2-digit", minute: "2-digit", timeZone: "UTC" });
  return `${t(fra)}–${t(til)}`;
}

function teikna(gogn) {
  const stadir = gogn.stadir;
  const bestur = stadir[0];
  const bestTier = tier(bestur.skor);
  const uppfaert = new Date(gogn.reiknad);
  const minAgo = Math.max(0, Math.round((Date.now() - uppfaert.getTime()) / 60000));
  const erSpa = bestur.nakvaemni === "spá";

  const html = `
    <div class="hero">
      <svg class="aurora-bg" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        ${stjornuSvg(35)}
        <path class="aurora-wave w1" d="M-50 190 C120 110 220 230 380 140 C480 90 560 150 650 100 C720 65 780 90 850 60" stroke="${COLOR_TEAL}" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.55"/>
        <path class="aurora-wave w2" d="M-50 225 C100 265 250 155 400 215 C520 260 600 185 700 215 C760 230 800 205 850 225" stroke="${COLOR_TEAL_LIGHT}" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.4"/>
        <path class="aurora-wave w3" d="M-50 150 C150 90 300 190 450 120 C560 75 650 130 850 80" stroke="${COLOR_VIOLET}" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.4"/>
      </svg>
      <div class="hero-copy">
        <div class="pill" style="background: rgba(255,255,255,0.14); color:white;">${gogn.dagur === 0 ? `<span class="live-dot"></span> Uppfært fyrir ${minAgo} mín` : "Spá — ekki bein mæling"}</div>
        <div class="hero-title">${dagsMerki(gogn.dagur)} eru bestu líkurnar við ${bestur.nafn}</div>
        <div class="hero-desc">${skyrsluText(bestur)}</div>
        ${erSpa ? `<div class="forecast-note">Byggt á Kp-spá (landsvísu) + staðbundinni skýjaspá — ekki jafn nákvæmt og bein norðurljósamæling.</div>` : ""}
      </div>
      <div class="score-card">
        <div style="font-size:13px; color:rgba(255,255,255,0.65); font-weight:500; margin-bottom:8px;">Norðurljósaskor</div>
        <div class="score-num" id="heroSkor">0.0</div>
        <div class="pill" style="background:${bestTier.litur}; color:var(--night-1); margin-top:12px;">${bestTier.texti} tækifæri</div>
      </div>
    </div>

    <div class="row">
      <div class="panel">
        <div class="display" style="font-size:19px;">Skorið á kortinu</div>
        <div style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">Litur sýnir gæði skilyrða ${dagsMerki(gogn.dagur).toLowerCase()} · smelltu á punkt fyrir nánar</div>
        <div id="map"></div>
        <div class="legend">
          <span><i style="background:${COLOR_TEAL};"></i>Frábært</span>
          <span><i style="background:${COLOR_AMBER};"></i>Sæmilegt</span>
          <span><i style="background:${COLOR_GREY};"></i>Óhagstætt</span>
        </div>
      </div>
    </div>

    <div id="stadir" style="margin-top:48px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between;">
        <div class="display" style="font-size:24px;">Allir staðir ${dagsMerki(gogn.dagur).toLowerCase()}</div>
        <div style="font-size:13px; color:var(--text-muted);">${stadir.length} staðir · reiknað kl. ${uppfaert.toLocaleTimeString("is-IS", { hour: "2-digit", minute: "2-digit", timeZone: "UTC" })}</div>
      </div>
      <div class="grid">
        ${stadir.map((s, i) => {
          const t = tier(s.skor);
          const vk = birtaVirkniEdaKp(s);
          const erBestur = i === 0;
          return `
          <div class="card ${erBestur ? "besti" : ""}" id="stadur-${s.id}" style="animation-delay:${Math.min(i, 8) * 45}ms">
            ${erBestur ? `<div class="besti-bordi">Besti staðurinn</div>` : ""}
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;">
              <div class="display" style="font-size:17px;">${s.nafn}</div>
              <div class="pill" style="background:${t.litur}; color:var(--night-1);">${s.skor}</div>
            </div>
            <div class="card-row"><span>${vk.merki}</span> ${vk.gildi}</div>
            <div class="card-row"><span>Skýjahula</span> ${birtaSky(s.hra_gogn.sky_hlutfall)}</div>
            <div class="card-row"><span>Myrkur</span> ${birtaMyrkur(s.hra_gogn.myrkur_fra, s.hra_gogn.myrkur_til)}</div>
            <div class="card-row"><span>Hiti</span> ${birtaHiti(s.hra_gogn.hiti, s.hra_gogn.hiti_finnst)}</div>
            <div class="card-row"><span>UV í dag</span> ${birtaUv(s.hra_gogn.uv_haest_i_dag)}</div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="panel-dark" id="gogn" style="margin-top:48px;">
      <div class="display" style="font-size:19px;">Áreiðanleg, opin gögn</div>
      <div style="font-size:13px; color:rgba(255,255,255,0.6);">Skorið reiknað úr þremur opinberum gagnaveitum</div>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:12px; margin-top:12px;">
        ${HEIMILDIR.map(h => `
          <div class="source-item" style="margin-top:0;">
            <div class="dot" style="background:${h.litur};"></div>
            <div>
              <div style="font-weight:600; font-size:14px;">${h.heiti}</div>
              <div style="font-size:12.5px; color:rgba(255,255,255,0.6); line-height:1.5;">${h.lysing}</div>
              ${h.utskyring ? `<div style="font-size:12px; color:rgba(255,255,255,0.55); line-height:1.55; margin-top:8px;">${h.utskyring}</div>` : ""}
              ${h.stig ? `
                <div style="display:flex; flex-direction:column; gap:7px; margin-top:10px;">
                  ${h.stig.map(st => `
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; color:rgba(255,255,255,0.75);">
                      <span style="display:flex; align-items:center; gap:7px; white-space:nowrap;">
                        <span style="width:8px; height:8px; border-radius:50%; background:${st.litur}; flex-shrink:0;"></span>
                        ${st.heiti}
                      </span>
                      <span style="color:rgba(255,255,255,0.45); white-space:nowrap;">${st.bil}</span>
                    </div>`).join("")}
                </div>` : ""}
            </div>
          </div>`).join("")}
      </div>
    </div>
  `;
  const content = document.getElementById("content");
  content.innerHTML = html;
  content.classList.remove("fade-in");
  void content.offsetWidth;
  content.classList.add("fade-in");
  sidustuGognin = gogn;
  initMap(stadir);
  teiknaSkorTolu("heroSkor", bestur.skor);
}

function initMap(stadir) {
  if (leafletMap) {
    leafletMap.remove();
    leafletMap = null;
  }
  markerarMap = {};
  leafletMap = L.map("map", { scrollWheelZoom: false }).setView([64.95, -18.7], 6);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> framlagsaðilar &copy; <a href="https://carto.com/attributions">CARTO</a>',
    maxZoom: 19,
    subdomains: "abcd",
  }).addTo(leafletMap);

  stadir.forEach(s => {
    const t = tier(s.skor);
    const vk = birtaVirkniEdaKp(s);
    const merki = L.circleMarker([s.lat, s.lon], {
      radius: 9,
      color: "white",
      weight: 2,
      fillColor: t.litur,
      fillOpacity: 0.9,
    })
      .addTo(leafletMap)
      .bindPopup(`
        <div class="map-popup">
          <div class="display">${s.nafn}</div>
          <div>Skor: <b>${s.skor}</b> · ${t.texti}</div>
          <div>${vk.merki} ${vk.gildi} · Ský ${birtaSky(s.hra_gogn.sky_hlutfall)}</div>
        </div>
      `);
    markerarMap[s.id] = merki;
  });
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function birtaLocResult(innihald, erVilla) {
  const box = document.getElementById("locResult");
  box.className = "loc-result" + (erVilla ? " villa" : "");
  box.innerHTML = innihald;
}

function finnaStadsetningu() {
  if (!navigator.geolocation) {
    birtaLocResult("Vafrinn þinn styður ekki staðsetningu.", true);
    return;
  }
  const takki = document.getElementById("locBtn");
  const takkiTexti = document.getElementById("locBtnText");
  takki.classList.add("leita");
  takkiTexti.textContent = "Staðset...";

  navigator.geolocation.getCurrentPosition(
    (stada) => {
      takki.classList.remove("leita");
      takkiTexti.textContent = "Nálægt mér";
      naestiStadur(stada.coords.latitude, stada.coords.longitude);
    },
    (villa) => {
      takki.classList.remove("leita");
      takkiTexti.textContent = "Nálægt mér";
      const skilabod = villa.code === villa.PERMISSION_DENIED
        ? "Leyfi til staðsetningar var hafnað."
        : "Ekki tókst að finna staðsetningu þína.";
      birtaLocResult(skilabod, true);
    },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 5 * 60 * 1000 }
  );
}

function naestiStadur(lat, lon) {
  if (!sidustuGognin || !sidustuGognin.stadir.length) {
    birtaLocResult("Gögnin eru ekki tilbúin ennþá — reyndu aftur eftir smá stund.", true);
    return;
  }
  let bestur = null;
  let minFjarlaegd = Infinity;
  sidustuGognin.stadir.forEach((s) => {
    const d = haversine(lat, lon, s.lat, s.lon);
    if (d < minFjarlaegd) {
      minFjarlaegd = d;
      bestur = s;
    }
  });

  birtaLocResult(`
    <span>Næst þér: <b>${bestur.nafn}</b> (${minFjarlaegd.toFixed(0)} km) — skor <b>${bestur.skor}</b></span>
    <button onclick="skodaStad('${bestur.id}')">Skoða á korti</button>
  `, false);
}

function skodaStad(id) {
  const kort = document.getElementById(`stadur-${id}`);
  if (kort) {
    kort.scrollIntoView({ behavior: "smooth", block: "center" });
    kort.classList.add("i-fokus");
    setTimeout(() => kort.classList.remove("i-fokus"), 2500);
  }
  const merki = markerarMap[id];
  if (merki && leafletMap) {
    leafletMap.flyTo(merki.getLatLng(), 10);
    merki.openPopup();
  }
}

function skyrsluText(stadur) {
  const sky = stadur.hra_gogn.sky_hlutfall;
  if (sky == null) return "Gögn um skýjahulu vantar fyrir þennan stað.";
  if (sky < 30) return "Heiðskírt og góð virkni í kvöld.";
  if (sky < 70) return "Nokkur ský en enn raunhæft tækifæri.";
  return "Þykk skýjahula dregur verulega úr líkum í kvöld.";
}

async function saekja() {
  try {
    const svar = await fetch(`/api/skor?dagur=${valinnDagur}`);
    if (!svar.ok) throw new Error("HTTP " + svar.status);
    const gogn = await svar.json();
    teikna(gogn);
  } catch (villa) {
    document.getElementById("content").innerHTML =
      `<div class="error">Ekki tókst að sækja gögn frá bakendanum (${villa.message}). Athugaðu að server.py sé í gangi.</div>`;
  }
}

teiknaTabs();
saekja();
setInterval(saekja, 5 * 60 * 1000);
</script>
